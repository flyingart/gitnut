<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 128" width="392" height="128">
  <title>gitnut</title>
  <defs>
    <!-- userSpaceOnUse over the "nut" glyphs only (x 236..361), so all three colours show on them -->
    <linearGradient id="w-nut" gradientUnits="userSpaceOnUse" x1="236" y1="40" x2="361" y2="96">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <g transform="translate(4 4) scale(0.9375)">
  <defs>
    <radialGradient id="d-shell" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#a8704f"/>
      <stop offset="0.6" stop-color="#6e412b"/>
      <stop offset="1" stop-color="#43261a"/>
    </radialGradient>
    <linearGradient id="d-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="55" fill="url(#d-shell)" stroke="url(#d-ring)" stroke-width="8"/>
  <!-- three coconut eyes = three commits; trunk forks into two branches -->
  <path d="M64 118 V86 C64 68 44 70 44 50 M64 86 C64 68 84 70 84 50" fill="none" stroke="#fdf2f8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#fdf2f8" stroke-width="5">
    <circle cx="44" cy="46" r="12" fill="#f472c6"/>
    <circle cx="84" cy="46" r="12" fill="#6d8cf5"/>
    <circle cx="64" cy="86" r="11" fill="#a78bfa"/>
  </g>
</g>
  <text x="136" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5" fill="#ffffff">git<tspan fill="url(#w-nut)">nut</tspan></text>
</svg>
