<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GitNut</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07060b; color: #ededf0; color-scheme: dark;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter Variable", "Segoe UI", system-ui, sans-serif; }
    body { display: grid; place-items: center; -webkit-user-select: none; user-select: none; }
    main { text-align: center; max-width: 34rem; padding: 2rem; }
    img { width: 84px; height: 84px; filter: drop-shadow(0 18px 40px rgb(167 139 250 / 35%)); }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 1.2rem 0 0.3rem; letter-spacing: -0.01em; }
    p { color: #9a9aa6; margin: 0; }
    .spin { width: 16px; height: 16px; margin: 1.2rem auto 0; border-radius: 50%;
      border: 2px solid rgb(255 255 255 / 12%); border-top-color: #c084fc; animation: s 0.8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    pre { display: none; text-align: left; white-space: pre-wrap; word-break: break-word; margin: 1.2rem 0 0; padding: 0.8rem 1rem;
      background: color-mix(in srgb, #0c0c10 80%, transparent); border: 1px solid rgb(255 255 255 / 8%); border-radius: 0.5rem;
      color: #f0a0a0; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; -webkit-user-select: text; user-select: text; }
    body.error .spin { display: none; }
    /* Windows: no native frame, so a minimal title bar to move and close the window while it loads */
    .titlebar { display: none; position: fixed; inset: 0 0 auto 0; height: 34px; justify-content: flex-end; }
    body.win .titlebar { display: flex; }
    /* macOS: the traffic lights float over the page (titleBarStyle "Overlay"); just a drag strip */
    body.mac .titlebar { display: flex; height: 44px; }
    body.mac .titlebar button { display: none; }
    .titlebar button { width: 46px; border: 0; background: transparent; color: #9a9aa6; font: 15px system-ui; }
    .titlebar button:hover { background: rgb(255 255 255 / 8%); color: #fff; }
    .titlebar .close:hover { background: #c42b1c; }
    body.error pre { display: block; }
  </style>
</head>
<body>
  <div class="titlebar" data-tauri-drag-region>
    <button type="button" aria-label="Minimize" onclick="win('minimize')">&#x2013;</button>
    <button type="button" class="close" aria-label="Close" onclick="win('close')">&#x2715;</button>
  </div>
  <main>
    <img src="logo.svg" alt="">
    <h1 id="title">Starting GitNut</h1>
    <p id="status">Looking for the local daemon…</p>
    <div class="spin"></div>
    <pre id="detail"></pre>
  </main>
  <script>
    const ipc = window.__TAURI_INTERNALS__;
    const win = (cmd) => ipc && ipc.invoke(`plugin:window|${cmd}`, { label: "main" });
    if (ipc && /Windows/i.test(navigator.userAgent)) document.body.classList.add("win");
    if (ipc && /Macintosh/i.test(navigator.userAgent)) document.body.classList.add("mac");
    // Called from Rust through webview.eval.
    window.gitnutStatus = (text) => { document.getElementById("status").textContent = text; };
    window.gitnutError = (text, detail) => {
      document.body.classList.add("error");
      document.getElementById("title").textContent = "GitNut could not start its daemon";
      document.getElementById("status").textContent = text;
      document.getElementById("detail").textContent = detail;
    };
  </script>
</body>
</html>
