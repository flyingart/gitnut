      <stop offset="1" stop-color="#b061f7"/>
    </linearGradient>
    <radialGradient id="g-glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5865f2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5865f2" stop-opacity="0"/>
